-- Crucible Revival: open the retail main menu; connect through Ready.
--
-- CryEngine executes autoexec.cfg AFTER system init, later than user.cfg and
-- much later than the `+map` launch argument that crashed this build early
-- (docs/08). That makes it the right place for a command that needs the game
-- to be up.
--
-- cl_serveraddr is described in the binary as "The NovaGameHub hostname to
-- connect to" and defaults to localhost; cl_serverport pairs with it. The
-- `connect` console command is "Connects to the game service and game
-- server", and `disconnect` is its counterpart - so this replaces the whole
-- PLAY -> mode -> READY click path.
--
-- Use `--` for comments in these files, not `//`.
-- Windowed and small, so launching this cannot take over a screen that has
-- a remote work session on it.
r_Fullscreen 0
r_Width 1280
r_Height 720

-- Re-assert the UDP encryption switches HERE as well as in user.cfg.
-- Evidence they did not take on the shard link: DtlsEndpoint::DecodePacket
-- (0x4fbc0b0) passes through untouched when [this+0xc8] is null, and the
-- client's own shard packets are NOT consistent with that passthrough, so a
-- DTLS context exists. user.cfg is parsed during system init, which may be
-- before these are registered; autoexec runs later.
net_UdpUseEncryption 0
net_EnableDtlsPreSharedKeys 0
net_UdpCompressor 0
net_UseDtlsCookies 0

-- Attempt to turn the transport's own logging up, so the client would narrate
-- what it receives instead of us guessing. UdpBaseConnection carries
--     [NET_CorePackets] %s: Received core packet %s
-- and there are 27 NET_* channel names in the binary (NET_CorePackets,
-- NET_ClientConnection, NET_DebugDtls, NET_Issues, ...).
--
-- RESULT 2026-09-18: NO EFFECT. Not one [NET_*] line appears in any log at
-- any of these settings, and none of these cvars is echoed or acknowledged.
-- The channels are compiled out of this release build. Kept here, with this
-- note, so the avenue is not tried a third time - do not expect log output
-- from the transport.
net_debugVerboseLevel 5
net_assertlogging 1
net_LogConnectionStats 1
log_Verbosity 4
log_WriteToFileVerbosity 4
log_IncludeTime 1

cl_serveraddr 127.0.0.1
cl_serverport 18877

-- Restored from misc.pak/autoexec.cfg: the loose file shadows this retail command.
map MainMenu
