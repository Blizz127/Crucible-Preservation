Crucible.AuthMethod 0

-- Revival: the LAN match server presents our own cert. The engine's
-- ValidatePinnedCertificate() compares it against a pinned certificate
-- (NovaGameClient log: "certs are different sizes; local 550 bytes, remote
-- 294 bytes"), which no self-hosted server can ever match - the pin is
-- Amazon's dead GameLift/NovaNet cert. net_SslAllowSelfSigned is already on
-- by default and clears the self-signed error; pinning is what still fails.
net_SslEnablePinning 0

